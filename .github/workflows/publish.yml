name: Publish

on:
  push:
    branches: [main, next]

permissions: {}

jobs:
  verify:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .nvmrc
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test

  select-mode:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      mode: ${{ steps.select.outputs.mode }}
      publish-plan-artifact-id: ${{ steps.select.outputs.publish-plan-artifact-id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .nvmrc
      - run: pnpm install --frozen-lockfile
      - id: select
        uses: changesets/action/select-mode@ae32849d5ba541f9ae29e40e22a623bc13562f51 # v2

  channel:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      accepted: ${{ steps.channel.outputs.accepted }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - id: channel
        run: |
          branch="${GITHUB_REF_NAME}"
          prerelease_file=".changeset/pre.json"

          if [ "$branch" = "main" ]; then
            if [ -f "$prerelease_file" ]; then
              echo "Unexpected prerelease state on main: $prerelease_file" >&2
              exit 1
            fi
            echo "accepted=true" >>"$GITHUB_OUTPUT"
            exit 0
          fi

          if [ "$branch" = "next" ]; then
            if [ ! -f "$prerelease_file" ]; then
              echo "No prerelease state on next; skipping version/publish jobs."
              echo "accepted=false" >>"$GITHUB_OUTPUT"
              exit 0
            fi

            node --eval '
              const fs = require("node:fs");

              let data;
              try {
                data = JSON.parse(fs.readFileSync(".changeset/pre.json", "utf8"));
              } catch (error) {
                console.error("Failed to parse .changeset/pre.json:", error);
                process.exit(1);
              }

              if (!data || typeof data !== "object") {
                console.error(".changeset/pre.json must contain an object.");
                process.exit(1);
              }

              if (data.mode === "exit") {
                console.log("accepted=false");
                process.exit(0);
              }

              if (data.mode === "pre" && data.tag === "next") {
                console.log("accepted=true");
                process.exit(0);
              }

              console.error("Expected prerelease state {\"mode\":\"pre\",\"tag\":\"next\"} or mode \"exit\".");
              process.exit(1);
            ' >>"$GITHUB_OUTPUT"
            exit 0
          fi

          echo "Unsupported release branch: $branch" >&2
          exit 1

  version:
    runs-on: ubuntu-latest
    needs: [verify, select-mode, channel]
    if: ${{ needs.channel.outputs.accepted == 'true' && needs.select-mode.outputs.mode == 'version' }}
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .nvmrc
      - run: pnpm install --frozen-lockfile
      - uses: changesets/action/version@ae32849d5ba541f9ae29e40e22a623bc13562f51 # v2
        with:
          script: pnpm exec changeset version
          pr-base-branch: ${{ github.ref_name }}

  pack:
    runs-on: ubuntu-latest
    needs: [verify, select-mode, channel]
    if: ${{ needs.channel.outputs.accepted == 'true' && needs.select-mode.outputs.mode == 'publish' }}
    permissions:
      contents: read
    outputs:
      pack-dir-artifact-id: ${{ steps.pack.outputs.pack-dir-artifact-id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .nvmrc
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - id: pack
        uses: changesets/action/pack@ae32849d5ba541f9ae29e40e22a623bc13562f51 # v2
        with:
          publish-plan-artifact-id: ${{ needs.select-mode.outputs.publish-plan-artifact-id }}

  publish:
    runs-on: ubuntu-latest
    needs: [verify, select-mode, channel, pack]
    if: ${{ needs.verify.result == 'success' && needs.channel.outputs.accepted == 'true' && needs.select-mode.outputs.mode == 'publish' && needs.pack.result == 'success' && (github.ref_name == 'main' || github.ref_name == 'next') }}
    environment: npm-publish
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .nvmrc
      - run: pnpm install --frozen-lockfile
      - uses: changesets/action/publish@ae32849d5ba541f9ae29e40e22a623bc13562f51 # v2
        with:
          pack-dir-artifact-id: ${{ needs.pack.outputs.pack-dir-artifact-id }}
          create-github-releases: ${{ github.ref_name == 'main' }}
          push-git-tags: ${{ github.ref_name == 'main' }}
