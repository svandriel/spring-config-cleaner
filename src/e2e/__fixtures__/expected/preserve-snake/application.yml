# Shared defaults for the payment orchestration service.
spring:
  application:
    name: payment-orchestrator
  config:
    import:
      - optional:configserver:${CONFIG_SERVER_URI:http://config-server:8888}
  cloud:
    config:
      enabled: true
      fail_fast: true
      retry:
        max_attempts: 5
    azure:
      profile:
        tenant_id: ${AZURE_TENANT_ID:00000000-0000-0000-0000-000000000000}
      credential:
        client_id: ${AZURE_CLIENT_ID:payments-api}
      active_directory:
        enabled: true
        app_id_uri: api://payments-api
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer_uri: ${ENTRA_ISSUER_URI:https://login.microsoftonline.com/00000000-0000-0000-0000-000000000000/v2.0}
  datasource:
    url: ${PAYMENTS_DB_URL:jdbc:postgresql://localhost:5432/payments}
    username: ${PAYMENTS_DB_USER:payments_app}
    password: ${PAYMENTS_DB_PASSWORD:}
    driver_class_name: org.postgresql.Driver
    hikari:
      maximum_pool_size: 20
      minimum_idle: 5
      connection_timeout: 30000
  liquibase:
    change_log: classpath:/db/changelog/db.changelog-master.yaml
    contexts: ${DB_MIGRATION_CONTEXT:default}
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
server:
  shutdown: graceful
  forward_headers_strategy: framework
management:
  endpoints:
    web:
      exposure:
        include:
          - health
          - info
          - prometheus
  endpoint:
    health:
      show_details: when-authorized
      probes:
        enabled: true
  metrics:
    distribution:
      percentiles_histogram:
        http.server.requests: true
app:
  security:
    audience: api://payments-api
  data_sources:
    ledger:
      driver_class_name: org.postgresql.Driver
      jdbc_url: ${LEDGER_DB_URL:jdbc:postgresql://localhost:5432/ledger}
      username: ${LEDGER_DB_USER:ledger_app}
      password: ${LEDGER_DB_PASSWORD:}
      hikari:
        maximum_pool_size: 10
    audit:
      driver_class_name: com.microsoft.sqlserver.jdbc.SQLServerDriver
      jdbc_url: ${AUDIT_DB_URL:jdbc:sqlserver://localhost:1433;databaseName=audit;encrypt=true}
      username: ${AUDIT_DB_USER:audit_app}
      password: ${AUDIT_DB_PASSWORD:}
      hikari:
        maximum_pool_size: 8
  messaging:
    service_bus:
      namespace: ${AZURE_SERVICE_BUS_NAMESPACE:payments-dev.servicebus.windows.net}
      queue_name: payment-events
  feature_flags:
    reconciliation_v2: false
