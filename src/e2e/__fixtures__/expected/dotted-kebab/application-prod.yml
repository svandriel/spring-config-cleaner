# Production environment overrides and inherited enterprise defaults.
spring.config.activate.on-profile: prod
spring.datasource.url: jdbc:postgresql://payments-primary.internal:5432/payments
spring.datasource.username: payments_prod
spring.datasource.hikari.maximum-pool-size: 40
spring.liquibase.contexts: production
spring.data.redis.host: payments-cache.internal
spring.data.redis.port: 6380
app.data-sources.ledger.jdbc-url: jdbc:postgresql://ledger-primary.internal:5432/ledger
app.data-sources.ledger.username: ledger_prod
app.data-sources.ledger.password: ${PROD_LEDGER_DB_PASSWORD:}
app.data-sources.ledger.hikari.maximum-pool-size: 30
app.data-sources.audit.jdbc-url: jdbc:sqlserver://audit-primary.internal:1433;databaseName=audit;encrypt=true
app.data-sources.audit.username: audit_prod
app.data-sources.audit.password: ${PROD_AUDIT_DB_PASSWORD:}
app.data-sources.audit.hikari.maximum-pool-size: 20
app.feature-flags.reconciliation-v2: true
