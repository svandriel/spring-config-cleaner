# Production environment overrides and inherited enterprise defaults.
spring:
  config:
    activate:
      onProfile: prod
  datasource:
    url: jdbc:postgresql://payments-primary.internal:5432/payments
    username: payments_prod
    hikari:
      maximumPoolSize: 40
  liquibase:
    contexts: production
  data:
    redis:
      host: payments-cache.internal
      port: 6380
app:
  dataSources:
    ledger:
      jdbcUrl: jdbc:postgresql://ledger-primary.internal:5432/ledger
      username: ledger_prod
      password: ${PROD_LEDGER_DB_PASSWORD:}
      hikari:
        maximumPoolSize: 30
    audit:
      jdbcUrl: jdbc:sqlserver://audit-primary.internal:1433;databaseName=audit;encrypt=true
      username: audit_prod
      password: ${PROD_AUDIT_DB_PASSWORD:}
      hikari:
        maximumPoolSize: 20
  featureFlags:
    reconciliationV2: true
